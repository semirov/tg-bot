# Полное тестовое окружение в Docker: Postgres (pg_trgm) + тестовый контейнер.
#
#   docker compose -f docker-compose.test.yml run --rm tests
#   docker compose -f docker-compose.test.yml run --rm e2e
#
# Сервисы видят друг друга по именам внутри сети compose.
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memes_test
      TZ: GMT+3
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d memes_test']
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        DEPS_IMAGE: ${DEPS_IMAGE:-cr.yandex/crp8g8jm3p8d780a8hk3/telegram-bot-deps:node20}
    depends_on:
      postgres:
        condition: service_healthy
    environment: &test-env
      NODE_ENV: test
      TG_ENV: test
      BOT_TOKEN: '111111:TEST_TOKEN'
      BOT_OWNER_ID: '424242'
      APP_API_ID: '123456'
      APP_API_HASH: 'test-api-hash'
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: memes_test
      USE_SSL: 'false'
      MANAGED_CHANNEL: '-1001111111111'
      BEST_MANAGED_CHANNEL: '-1002222222222'
      USER_REQUEST_CHANNEL: '-1003333333333'
      CRINGE_CHANNEL: '-1004444444444'
      PARSER_USER_ID: '777777'
      S3_ENDPOINT: 'https://storage.example.test'
      S3_REGION: ru-central1
      S3_BUCKET: test-bucket
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      MATTERMOST_BASE_URL: 'https://mattermost.example.test'
      MATTERMOST_TOKEN: test
      MATTERMOST_CHANNEL_ID: test
      DEEPSEEK_API_KEY: test
      DEEPSEEK_BASE_URL: 'https://api.deepseek.test'
      DEEPSEEK_MODEL: deepseek-flash
    command: ['npx', 'nx', 'test', 'memes-bot', '--codeCoverage']

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        DEPS_IMAGE: ${DEPS_IMAGE:-cr.yandex/crp8g8jm3p8d780a8hk3/telegram-bot-deps:node20}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *test-env
    command: ['npx', 'jest', '--config', 'apps/memes-bot/jest-e2e.config.ts', '--runInBand']
