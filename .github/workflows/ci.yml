name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Не запускать два деплоя одновременно.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Гасим только deprecation-шум рантайма (punycode/url.parse) — ошибки остаются видны.
  NODE_OPTIONS: --no-deprecation
  # BuildKit нужен для cache mount в Dockerfile (app) и build-base.
  DOCKER_BUILDKIT: '1'

jobs:
  deps:
    name: Dependency base images
    # Базовые образы пересобираются только при изменении package-lock.json.
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, memes-bot]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect package-lock change
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD -- package-lock.json | grep -q 'package-lock.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build & push dependency bases (node20 + node22)
        if: steps.changed.outputs.changed == 'true'
        run: |
          bash tools/ci/build-base.sh 20
          bash tools/ci/build-base.sh 22

  test:
    name: Lint, tests, coverage, build
    runs-on: [self-hosted, linux, x64, memes-bot]
    steps:
      - uses: actions/checkout@v5
      - name: Ensure dependency base image
        run: bash tools/ci/build-base.sh 20
      - name: Build test image
        run: docker build -f Dockerfile.test --build-arg DEPS_IMAGE="$(cat .deps-image)" -t memes-bot-tests .
      - name: Lint
        run: docker run --rm -e NODE_OPTIONS=--no-deprecation memes-bot-tests npx nx lint memes-bot
      - name: Unit tests + coverage (порог 95%)
        run: docker run --rm -e NODE_OPTIONS=--no-deprecation memes-bot-tests npx nx test memes-bot --codeCoverage
      - name: Build & push production image
        run: |
          source tools/ci/docker-config.sh
          IMAGE=cr.yandex/crp8g8jm3p8d780a8hk3/telegram-bot
          TAG="sha-${GITHUB_SHA::7}"
          docker build --build-arg DEPS_IMAGE="$(cat .deps-image)" -f apps/memes-bot/Dockerfile -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  e2e:
    name: E2E
    needs: test
    runs-on: [self-hosted, linux, x64, memes-bot]
    steps:
      - uses: actions/checkout@v5
      - name: Ensure dependency base image
        run: bash tools/ci/build-base.sh 20
      - name: Run e2e (Postgres + приложение)
        run: docker compose -f docker-compose.test.yml run --rm -T --build e2e
      - name: Cleanup e2e env
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  release:
    name: Semantic release
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, memes-bot]
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Semantic release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/release.sh

  deploy:
    name: Deploy
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: [self-hosted, linux, x64, memes-bot]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Deploy ${{ needs.release.outputs.version }}
        run: bash tools/deploy/deploy.sh "${{ needs.release.outputs.version }}" "${GITHUB_SHA::7}"
