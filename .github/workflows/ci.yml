name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Не запускать два деплоя одновременно.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Гасим только deprecation-шум рантайма (punycode/url.parse) — ошибки остаются видны.
  NODE_OPTIONS: --no-deprecation
  # BuildKit нужен для cache mount в Dockerfile (app) и build-base.
  DOCKER_BUILDKIT: '1'

jobs:
  test:
    name: Lint, tests, coverage, build
    runs-on: [self-hosted, linux, x64, memes-bot]
    steps:
      - uses: actions/checkout@v5
      - name: Ensure dependency base image
        run: bash tools/ci/build-base.sh 20
      - name: Build test image
        run: docker build -f Dockerfile.test --build-arg DEPS_IMAGE="$(cat .deps-image)" -t memes-bot-tests .
      - name: Lint
        run: docker run --rm -e NODE_OPTIONS=--no-deprecation memes-bot-tests npx nx lint memes-bot
      - name: Unit tests + coverage (порог 95%)
        run: docker run --rm -e NODE_OPTIONS=--no-deprecation memes-bot-tests npx nx test memes-bot --codeCoverage
      - name: Build & push production image
        run: |
          source tools/ci/docker-config.sh
          IMAGE=cr.yandex/crp8g8jm3p8d780a8hk3/telegram-bot
          TAG="sha-${GITHUB_SHA::7}"
          docker build --build-arg DEPS_IMAGE="$(cat .deps-image)" -f apps/memes-bot/Dockerfile -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  release:
    name: Semantic release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, memes-bot]
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure node22 deps image
        run: bash tools/ci/build-base.sh 22
      - name: Semantic release (в контейнере, без npm ci)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPS="$(cat .deps-image)"
          VOL="semantic-release-node-modules-${DEPS##*:}"
          docker run --rm \
            -v "$PWD":/usr/src/app \
            -v "$VOL":/usr/src/app/node_modules \
            -e GITHUB_TOKEN \
            -e GIT_AUTHOR_NAME=github-actions \
            -e GIT_AUTHOR_EMAIL=github-actions@github.com \
            -e GIT_COMMITTER_NAME=github-actions \
            -e GIT_COMMITTER_EMAIL=github-actions@github.com \
            -w /usr/src/app \
            "$DEPS" bash tools/ci/release.sh

  deploy:
    name: Deploy
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: [self-hosted, linux, x64, memes-bot]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Deploy ${{ needs.release.outputs.version }}
        run: bash tools/deploy/deploy.sh "${{ needs.release.outputs.version }}" "${GITHUB_SHA::7}"
