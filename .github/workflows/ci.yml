name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  # Ручной деплой текущего main без релиза (аварийное восстановление).
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для деплоя (по умолчанию — текущий APP_VERSION с сервера)'
        required: false
        default: ''

# Не запускать два деплоя одновременно.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Гасим только deprecation-шум рантайма (punycode/url.parse) — ошибки остаются видны.
  NODE_OPTIONS: --no-deprecation
  # BuildKit нужен для cache mount в Dockerfile (app) и build-base.
  DOCKER_BUILDKIT: '1'
  # Раннер — нативный arm64 на мак-мини (amd64-воркер под QEMU падает).
  # Прод-образ и тест-образ обязаны быть linux/amd64: Docker строит/запускает
  # их через QEMU, что проверено (120 сюитов/2284 теста, прод-билд ~70с).
  DOCKER_DEFAULT_PLATFORM: linux/amd64

jobs:
  deps:
    name: Dependency base images
    # Базовые образы пересобираются только при изменении package-lock.json.
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, arm64, memes-bot]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect package-lock change
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD -- package-lock.json | grep -q 'package-lock.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build & push dependency bases (node20 + node22)
        if: steps.changed.outputs.changed == 'true'
        run: |
          bash tools/ci/build-base.sh 20
          bash tools/ci/build-base.sh 22

  test:
    name: Lint, tests, coverage, build
    runs-on: [self-hosted, linux, arm64, memes-bot]
    steps:
      - uses: actions/checkout@v5
      - name: Docker registry auth
        run: |
          source tools/ci/docker-config.sh
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Ensure dependency base image
        run: bash tools/ci/build-base.sh 20
      - name: Build test image
        run: docker build -f Dockerfile.test --build-arg DEPS_IMAGE="$(cat .deps-image)" -t memes-bot-tests .
      - name: Lint
        run: docker run --rm -e NODE_OPTIONS=--no-deprecation memes-bot-tests npx nx lint memes-bot
      - name: Deploy guards (offline shell tests)
        # TGB-112: the target guard and the pre/post flight refuse deploys on a frozen
        # or retired host, on drift, and on a second instance. They are only worth
        # having if their negative cases run on every push — all three suites are pure
        # bash with a stubbed docker (seconds, no container, no secret).
        # They run INSIDE the test image on purpose: the preflight suite builds its
        # getUpdates-conflict fixture from the installed grammY instead of trusting a
        # hand-written string, and that is where node + node_modules exist (review B1).
        run: |
          docker run --rm memes-bot-tests bash tools/ci/deploy-target-guard.test.sh
          docker run --rm memes-bot-tests bash tools/deploy/remote-preflight.test.sh
          docker run --rm memes-bot-tests bash tools/deploy/deploy-guards.test.sh
      - name: Backup contour (offline shell tests)
        # TGB-113: the backup scripts are the contour, so their negative cases must run
        # on every push — plaintext refused, truncated download refused, parity
        # mismatch, stale artifact, missing identity, rotation boundaries. All five
        # suites are pure bash with PATH stubs (no host, no docker, no secret) and run
        # inside the test image, next to the deploy guards above.
        run: |
          docker run --rm memes-bot-tests bash -c '
            set -e
            for suite in remote-dump db-backup restore-drill offsite-pull notify-failure; do
              echo "== tools/backup/$suite.test.sh =="
              bash "tools/backup/$suite.test.sh"
            done'
      - name: Unit tests + coverage (порог 95%)
        run: docker run --rm -e NODE_OPTIONS=--no-deprecation memes-bot-tests npx nx test memes-bot --codeCoverage
      - name: Build & push production image
        run: |
          source tools/ci/docker-config.sh
          IMAGE=cr.yandex/crp8g8jm3p8d780a8hk3/telegram-bot
          TAG="sha-${GITHUB_SHA::7}"
          # --provenance=false --sbom=false on every push path: this registry rejects
          # the BuildKit attestation manifest (TGB-112, 2026-10-14, "Cannot read
          # manifest data"), so a push that emits one cannot succeed. Re-enable when
          # the registry accepts it again.
          docker build --provenance=false --sbom=false \
            --build-arg DEPS_IMAGE="$(cat .deps-image)" -f apps/memes-bot/Dockerfile -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  e2e:
    name: E2E
    needs: test
    runs-on: [self-hosted, linux, arm64, memes-bot]
    steps:
      - uses: actions/checkout@v5
      - name: Docker registry auth
        run: |
          source tools/ci/docker-config.sh
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Ensure dependency base image
        run: bash tools/ci/build-base.sh 20
      - name: Run e2e (Postgres + приложение)
        run: docker compose -f docker-compose.test.yml run --rm -T --build e2e
      - name: Cleanup e2e env
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  release:
    name: Semantic release
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, memes-bot]
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Semantic release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/release.sh

  deploy:
    name: Deploy
    needs: [release, test, e2e]
    # Обычный путь: после релиза. Аварийный: ручной запуск workflow.
    if: |
      always() && (needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, arm64, memes-bot]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Deploy target guard
        # Fails closed before any docker or ssh call: a retired host (TGB-112 moved the
        # memes bot off 38.180.69.206), an ambiguous target file, or a host that would
        # be read as an ssh option. deploy.sh runs the same guard as its first step.
        run: bash tools/ci/deploy-target-guard.sh "${DEPLOY_SECRETS_DIR:-/deploy-secrets}/target.env"
      - name: Deploy ${{ needs.release.outputs.version || inputs.version }}
        run: bash tools/deploy/deploy.sh "${{ needs.release.outputs.version || inputs.version || '0.0.0-manual' }}" "${GITHUB_SHA::7}"
